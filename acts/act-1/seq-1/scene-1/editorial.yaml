# editorial.yaml — AI Agent editorial decisions
# Lives at: my-documentary/acts/act-1/seq-1/scene-1/editorial.yaml
#
# THIS FILE IS GENERATED BY THE AI AGENT.
# It can be regenerated without affecting scene.yaml, narration, or timings.
# It can also be hand-tweaked by the creator after generation.
#
# The agent reads: narration.txt, words.json, scene.yaml (available_visuals)
# The agent writes: this file

# ──────────────────────────────────────────────
# SEGMENT INTENT — the 6 continuous dials (0.0 → 1.0)
# Code maps these to render parameters using pure math.
# ──────────────────────────────────────────────
intent:
  weight: 0.4          # boundary significance after this scene
  energy: 0.3          # kinetic energy level
  contrast: 0.5        # how different this is from next scene
  breath: 0.6          # space after this scene
  warmth: 0.4          # emotional temperature
  density: 0.4         # visual change frequency

# ──────────────────────────────────────────────
# SFX — structural sound design (NOT pinned to words)
# These create atmosphere and signal transitions.
# ──────────────────────────────────────────────
sfx:
  # Sound that leads INTO this scene (plays during gap before)
  entry: 0.3
  entry_src: assets/sfx/transitions/riser_subtle.wav

  # Sound that trails OUT of this scene (plays during gap after)
  exit: 0.5
  exit_src: assets/sfx/transitions/resonance_low.wav

  # Textural bed underneath narration (always subtle)
  bed: 0.4
  bed_src: assets/sfx/beds/industrial_hum.wav

# ──────────────────────────────────────────────
# WORD EVENTS — pinned to word indices from words.json
# Only visual changes and music intensity shifts.
# No SFX here — that's the lesson.
# ──────────────────────────────────────────────
word_events:

  # "The average factory..." — show the factory
  - type: visual-change
    at_word: 0
    visual_id: factory_exterior       # references scene.yaml available_visuals
    animation: ken-burns
    direction: zoom-in                # slow push in

  # "while" — the pivot word, visual shifts to contrast
  - type: visual-change
    at_word: 12
    visual_id: robot_arm
    animation: ken-burns
    direction: pan-right

  # Music swells slightly at the contrast point
  - type: music-intensity
    at_word: 12
    intensity: 0.6                    # 0 = barely there, 1 = full

  # "fifteen lakh rupees" — show the cost as text overlay
  - type: text-overlay
    at_word: 18
    visual_id: cost_title             # references scene.yaml available_visuals
    duration_words: 3                 # visible for words 18, 19, 20

  # Music drops back after the statement lands
  - type: music-intensity
    at_word: 20
    intensity: 0.3
